name: Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests and lint
        run: make mobile-test && cd apps/mobile && ./gradlew :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android lifecycle and inbox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: cd apps/mobile && ./gradlew :app:connectedDebugAndroidTest
      - name: Build debug APK after tests
        run: cd apps/mobile && ./gradlew :app:assembleDebug
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: my-feed-debug-${{ github.sha }}
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            apps/mobile/app/build/reports/
            apps/mobile/app/build/outputs/androidTest-results/
